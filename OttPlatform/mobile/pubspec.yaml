name: ott_platform
description: A production-ready Basic OTT Platform Flutter mobile application.
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  dio: ^5.3.3
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  video_player: ^2.8.1
  chewie: ^1.7.1
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
