version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ott_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ott_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: OttPlatform.API/Dockerfile
    container_name: ott_api
    restart: always
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=ott_db;Username=postgres;Password=postgres
      - Jwt__Key=SecretKeyThatIsAtLeast32CharsLong!!
      - Jwt__Issuer=OttPlatform
      - Jwt__Audience=OttPlatformUsers
    depends_on:
      - db

volumes:
  postgres_data:
